services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq  # node name and data directory depend on hostname
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  rabbitmq-data:
  pg-data:
